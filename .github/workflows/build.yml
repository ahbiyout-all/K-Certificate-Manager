name: K-Certificate Manager CI Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Release Windows Desktop Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project Version (SemVer)
        id: version_step
        shell: pwsh
        run: |
          $ver = "2.3.0"
          if ("${{ github.ref_name }}".StartsWith("v")) {
            $ver = "${{ github.ref_name }}".Substring(1)
          } elseif (Test-Path "package.json") {
            try {
              $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
              if ($pkg.version) { $ver = $pkg.version }
            } catch {}
          }
          $ver = $ver.Trim()
          Write-Host "Target Version: $ver"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_VER=$ver`n")

      # ------------------------------------------------------------------------
      # Node.js 24 Next-Gen / Node.js 22 LTS Runtime (Node.js 20 Deprecated & EOL Resolution)
      # ------------------------------------------------------------------------
      - name: Setup Node.js (Node 24 Next-Gen / Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Web Management Console (Vite Web Bundle)
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            Write-Host "Found package-lock.json. Running npm ci..."
            npm ci
          } else {
            Write-Host "No package-lock.json found. Running npm install..."
            npm install
          }
          Write-Host "Building Vite Web Bundle..."
          npm run build
          if (-not (Test-Path "dist")) {
            throw "Error: dist directory was not generated by npm run build!"
          }
          Write-Host "Vite Web Management Bundle compiled successfully."

          # Copy web bundle to dist/v$ver/web for structured installer packaging
          $ver = "${{ env.APP_VER }}"
          $webDir = "dist/v$ver/web"
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null
          Get-ChildItem -Path "dist" -Exclude "v*" | Copy-Item -Destination $webDir -Recurse -Force
          Write-Host "Vite web assets staged in $webDir"
          Get-ChildItem $webDir

      # ------------------------------------------------------------------------
      # .NET SDK Environment Setup (.NET 8 & 10 Support)
      # ------------------------------------------------------------------------
      - name: Setup .NET SDK (8.0.x & 10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET Solution
        run: dotnet restore KCertManager.sln

      - name: Build KCert.Core DLL
        run: dotnet build src-wpf/KCert.Core/KCert.Core.csproj -c Release -p:Version=${{ env.APP_VER }} -p:AssemblyVersion=${{ env.APP_VER }}.0 -p:FileVersion=${{ env.APP_VER }}.0 -o dist/v${{ env.APP_VER }}/core-dll

      - name: Build KCert.Crypto DLL
        run: dotnet build src-wpf/KCert.Crypto/KCert.Crypto.csproj -c Release -p:Version=${{ env.APP_VER }} -p:AssemblyVersion=${{ env.APP_VER }}.0 -p:FileVersion=${{ env.APP_VER }}.0 -o dist/v${{ env.APP_VER }}/core-dll

      - name: Build & Publish WPF Desktop App (x64 Standalone Single-File)
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VER }}"
          $outDir = "dist/v$ver/win-x64"
          dotnet publish src-wpf/KCertManager.Wpf/KCertManager.Wpf.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o $outDir

          if (Test-Path "$outDir/KCertManager.exe") {
            Copy-Item "$outDir/KCertManager.exe" "$outDir/KCertManager_v$ver.exe" -Force
            Write-Host "Verified WPF executable at $outDir/KCertManager.exe and KCertManager_v$ver.exe"
          } else {
            throw "Error: WPF single-file executable was not generated at $outDir/KCertManager.exe"
          }

      # ------------------------------------------------------------------------
      # Inno Setup 6 Official Installer Compilation (.exe)
      # ------------------------------------------------------------------------
      - name: Build Inno Setup Installer (.exe with Version Suffix)
        shell: pwsh
        run: |
          $isccPath = $null
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            $isccPath = "iscc"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          $ver = "${{ env.APP_VER }}"
          $installerDir = "dist/v$ver/installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          Write-Host "Compiling Inno Setup installer for version $ver via $isccPath..."
          & $isccPath "/DMyAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Error: Inno Setup ISCC compilation failed with exit code $LASTEXITCODE"
          }

          # Check and verify installer binary
          $installerFiles = Get-ChildItem "$installerDir/*.exe" -ErrorAction SilentlyContinue
          if (-not $installerFiles -or $installerFiles.Count -eq 0) {
            $fallback = Get-ChildItem -Path "Output/*.exe", "dist/installer/*.exe" -ErrorAction SilentlyContinue
            if ($fallback) {
              Write-Host "Relocating installer from $($fallback[0].FullName) to $installerDir"
              Move-Item $fallback[0].FullName "$installerDir" -Force
            } else {
              throw "Error: No installer executable was found in $installerDir or fallback folders!"
            }
          }
          Write-Host "Installer build verified successfully. Contents of installer directory:"
          Get-ChildItem $installerDir

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KCertManager-v${{ env.APP_VER }}-Installer-Setup
          path: dist/v${{ env.APP_VER }}/installer/kcert-manager-v${{ env.APP_VER }}-setup.exe
          retention-days: 14

      # ------------------------------------------------------------------------
      # GitHub Release: 인스톨러(Setup.exe) 단일 설치형 앱만 첨부 및 자동 배포
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: K-Certificate Manager v${{ env.APP_VER }}
          body: |
            ## 🛡️ K-Certificate Manager (K-인증서 매니저) v${{ env.APP_VER }}
            
            대한민국 공무원 행정전자서명(GPKI/EPKI) 및 금융 공동인증서(NPKI) 자동 탐색·USB 일괄 백업 & PC 역방향 복사 관리 솔루션
            
            ### 👨‍💻 제작자 및 공식 채널
            - **개발자**: AhBiYout (GitHub: [AhBiYout-all](https://github.com/AhBiYout-all))
            - **공식 기술 블로그**: [https://ahbiyoutvibe.blogspot.com/](https://ahbiyoutvibe.blogspot.com/)
            - **소속 회사**: [(주)청운정보시스템 ( cisnet.co.kr )](https://www.cisnet.co.kr)
            - **소스코드 저장소**: [https://github.com/AhBiYout-all/K-Certificate-Manager](https://github.com/AhBiYout-all/K-Certificate-Manager)
            
            ### 📦 공식 배포 설치 프로그램 (Official Windows Installer)
            - **`kcert-manager-v${{ env.APP_VER }}-setup.exe`**: 윈도우 정식 설치 프로그램 (단일 배포 패키지)
              - 폴더 풀림(Unpacked Multi-File) 개별파일 정규 설치
              - 기존 버전 감지 시 삭제/덮어쓰기 선택 지원
              - 무인 설치(Silent Install: `/SILENT`, `/VERYSILENT`) 완벽 지원
              - Windows 방화벽 인바운드 규칙 자동/사전 등록
            
            ### ✨ 주요 기능 및 업데이트 (v${{ env.APP_VER }})
            - **앱 시작 무응답(응답없음) 해소 & 3단계 비블로킹 초기 스캔 엔진 (WPF)**: Local Fast-Pass 우선 스캔, OS `DriveType` 기반 연결 끊긴 네트워크·광학 드라이브 사전 차단, 드라이브별 시간제한 가드, `ReparsePoint` 순환 링크 방어 및 배치 UI 갱신 탑재
            - **2026 RSA 3072-bit 상향(2027.02 의무화) 및 보안 강도 진단 스위트 (Web & WPF)**: RSA-3072/ECDSA-256 검증, 취약 암호 알고리즘·만료 예정 진단 및 갱신 권고 제공
            - **2026 국내 인증 동향·모바일 신분증(8종)·비액티브엑스 GPKI/EPKI·금융/간편인증 가이드 통합**: 웹 2026 동향 모달·WPF 정책 툴바 및 최신 전자서명 비교·전환 가이드 제공
            - **비표준 경로 정위치 복구·안전 휴지통 격리 & `Class1` 기관·특수목적 인증서 정밀 구분**: 개인키 페어링 검증, `class1` 계층 유지, `SafetyTrash` 격리 및 탐색기 드라이브 루트 직접 호출 지원
            - **앱 내 직접 다운로드·무인 셀프 업데이트 엔진 & 다크 테마 통합 (WPF & Web)**: GitHub 릴리스 3-Tier 자동 탐색, PE/SHA-256 무결성 검증, DPAPI + AES-256 보호 보관함 및 `/SILENT` 무인 설치 지원
            - **멀티 타겟 .NET (10.0 / 8.0) & Node.js 22/24 빌드 파이프라인**: `KCert.Core.dll` / `KCert.Crypto.dll` 분리 패키징 및 Inno Setup 정식 설치 프로그램 제공

            상세 변경 내역은 저장소 내 `docs/PATCHNOTES.md`를 참고해 주시기 바랍니다.
          files: |
            dist/v${{ env.APP_VER }}/installer/kcert-manager-v${{ env.APP_VER }}-setup.exe
