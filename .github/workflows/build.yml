name: K-Certificate Manager CI Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Desktop Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project Version (SemVer)
        id: version_step
        shell: pwsh
        run: |
          $ver = "1.7.2"
          if ("${{ github.ref_name }}".StartsWith("v")) {
            $ver = "${{ github.ref_name }}".Substring(1)
          } elseif (Test-Path "package.json") {
            try {
              $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
              if ($pkg.version) { $ver = $pkg.version }
            } catch {}
          }
          $ver = $ver.Trim()
          Write-Host "Target Version: $ver"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_VER=$ver`n")

      # ------------------------------------------------------------------------
      # Node.js 24 Next-Gen / Node.js 22 LTS Runtime (Node.js 20 Deprecated & EOL Resolution)
      # ------------------------------------------------------------------------
      - name: Setup Node.js (Node 24 Next-Gen / Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Web Management Console (Vite Web Bundle)
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            Write-Host "Found package-lock.json. Running npm ci..."
            npm ci
          } else {
            Write-Host "No package-lock.json found. Running npm install..."
            npm install
          }
          Write-Host "Building Vite Web Bundle..."
          npm run build
          if (-not (Test-Path "dist")) {
            throw "Error: dist directory was not generated by npm run build!"
          }
          Write-Host "Vite Web Management Bundle compiled successfully."
          Get-ChildItem dist

      # ------------------------------------------------------------------------
      # .NET SDK Environment Setup (.NET 8 & 10 Support)
      # ------------------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET Solution
        run: dotnet restore KCertManager.sln

      - name: Build KCert.Core DLL
        run: dotnet build src-wpf/KCert.Core/KCert.Core.csproj -c Release -p:Version=${{ env.APP_VER }} -p:AssemblyVersion=${{ env.APP_VER }}.0 -p:FileVersion=${{ env.APP_VER }}.0 -o release/05_WpfDesktop

      - name: Build & Publish WPF Desktop App (x64 Standalone Single-File)
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VER }}"
          dotnet publish src-wpf/KCertManager.Wpf/KCertManager.Wpf.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o release/05_WpfDesktop

          $ver = "${{ env.APP_VER }}"
          if (Test-Path "release/05_WpfDesktop/KCertManager.exe") {
            Copy-Item "release/05_WpfDesktop/KCertManager.exe" "release/05_WpfDesktop/KCertManager_v$ver.exe" -Force
          }

      # ------------------------------------------------------------------------
      # Inno Setup 6 Official Installer Compilation (.exe)
      # ------------------------------------------------------------------------
      - name: Build Inno Setup Installer (.exe with Version Suffix)
        shell: pwsh
        run: |
          $isccPath = $null
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            $isccPath = "iscc"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          New-Item -ItemType Directory -Force -Path release\07_Installer | Out-Null
          $ver = "${{ env.APP_VER }}"
          Write-Host "Compiling Inno Setup installer for version $ver..."
          & $isccPath "/DMyAppVersion=$ver" installer.iss
          Write-Host "Installer build finished. Listing release/07_Installer:"
          Get-ChildItem release\07_Installer

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KCertManager-v${{ env.APP_VER }}-Installer-Setup
          path: release/07_Installer/
          retention-days: 14

      # ------------------------------------------------------------------------
      # GitHub Release: 인스톨러(Setup.exe) 단일 자산만 첨부 및 자동 배포
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: K-Certificate Manager v${{ env.APP_VER }}
          body: |
            ## 🛡️ K-Certificate Manager (K-인증서 매니저) v${{ env.APP_VER }}
            
            대한민국 공무원 행정전자서명(GPKI/EPKI) 및 금융 공동인증서(NPKI) 자동 탐색·USB 일괄 백업 & PC 역방향 복사 관리 솔루션
            
            ### 👨‍💻 제작자 및 공식 채널
            - **개발자**: AhBiYout (GitHub: [AhBiYout-all](https://github.com/AhBiYout-all))
            - **공식 기술 블로그**: [https://ahbiyoutvibe.blogspot.com/](https://ahbiyoutvibe.blogspot.com/)
            - **소속 회사**: [(주)씨아이에스넷 (CISNet)](https://www.cisnet.co.kr)
            - **소스코드 저장소**: [https://github.com/AhBiYout-all/K-Certificate-Manager](https://github.com/AhBiYout-all/K-Certificate-Manager)
            
            ### 📦 배포 설치 파일 (Official Installer Asset)
            - **`kcert-manager-v${{ env.APP_VER }}-setup.exe`**: 윈도우 정식 설치 프로그램
              - 폴더 풀림(Unpacked Multi-File) 개별파일 정규 설치
              - 기존 버전 감지 시 삭제/덮어쓰기 선택 지원
              - 무인 설치(Silent Install: `/SILENT`, `/VERYSILENT`) 완벽 지원
              - Windows 방화벽 인바운드 규칙 자동/사전 등록 (기본 이름 및 버전 포함 이름 동시 등록)
            
            ### ✨ 주요 기능 및 업데이트 (v${{ env.APP_VER }})
            - 상단 헤더 가로 볼륨 슬라이더 바 (Horizontal Sound Slider Bar) 상시 탑재 (원클릭 음소거 토글, 0%~100% 범위 슬라이더, 볼륨 수치, 미리듣기 버튼)
            - 눈에 잘 띄는 [⚙️ 환경 설정] 버튼 상단 헤더 상시 노출로 환경 설정 창 호출 직관성 극대화
            - Windows C# WPF 데스크톱 전용 `SettingsDialog.xaml` 신설 (알림음, 미리듣기, 4대 테마, 모드 전환)
            - 로컬 환경 설정 영구 저장 서비스 (`SettingsService.cs`) 구축 (`%LocalAppData%\KCertManager\kcert_settings.json`)
            - '다시 표시하지 않음' CheckBox Two-Way 양방향 바인딩 및 XAML Spacing 제거로 CI 빌드 무결성 확보
            - 만료 인증서 안전 정리 시 삭제 수량과 안전 격리 휴지통 수량 100% 일치화 및 메타데이터 복원 (v1.7.1 계승)
            - 보안 영구 삭제 증적 감사 로그 (SubjectDN 포렌식) 감사 시스템 및 .log 보고서 내보내기
            - Node.js 24 Next-Gen 및 Node.js 22 LTS 런타임 최신화

            상세 변경 내역은 저장소 내 `docs/PATCHNOTES.md`를 참고해 주시기 바랍니다.
          files: |
            release/07_Installer/*.exe
